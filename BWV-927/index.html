function startWithName(event){event.preventDefault();const n=$("studentInput").value.trim();if(!n){$("studentInput").focus();return;}studentName=n;$("studentTag").textContent="Leerling: "+n;$("nameOverlay").classList.add("hidden");render();}
let idx=0,done={},attempts={},errors={},order=Array(8).fill(null),activePiece=null,wrong=false,finished=false;
const $=id=>document.getElementById(id),shuffled=[5,2,7,0,6,3,1,4];
const tasks=[{start:2,opts:[4,3,6],correct:1},{start:4,opts:[6,5,1],correct:1},{start:6,opts:[7,2,4],correct:0}];
function fig(src){return `<div class="score"><img src="${src}" alt="Muziekfragment"></div>`}
function mark(ok){attempts[idx]=(attempts[idx]||0)+1;if(!ok)errors[idx]=(errors[idx]||0)+1;wrong=!ok;if(ok)done[idx]=true;render()}
function render(){if(finished)return results();const l=levels[idx];$('chapter').textContent=l.chapter;$('title').textContent=l.title;$('question').textContent=l.q;$('counter').textContent=`LEVEL ${idx+1} / ${levels.length}`;$('progress').innerHTML=levels.map((_,i)=>`<span class="${done[i]?'done':''}"></span>`).join('');$('status').textContent=Object.keys(done).length+' / '+levels.length+' voltooid';$('prev').disabled=idx===0;$('next').disabled=!done[idx];$('next').textContent=idx===levels.length-1?'Bekijk resultaten →':'Volgende →';$('feedback').classList.toggle('hidden',!done[idx]&&!wrong);$('feedback').textContent=done[idx]?'✓ '+l.explain:'Probeer nog eens. Kijk goed naar de noten.';
let html='';
if(l.type==='puzzle'){
html+='<div class="pair-slots">'+order.map((n,i)=>`<div class="pair-slot" ondragover="event.preventDefault()" ondrop="dropPair(event,${i})" onclick="placePair(${i})">${n===null?`<span>${i+1}</span>`:`<img src="${P(n)}" alt="Geplaatst fragment">`}</div>`).join('')+'</div>';
html+='<div class="pair-tiles">'+shuffled.map(n=>`<button class="pair-tile ${order.includes(n)?'used':''} ${activePiece===n?'active':''}" draggable="${!order.includes(n)}" ondragstart="dragPair(event,${n})" onclick="selectPair(${n})" ${order.includes(n)?'disabled':''}><img src="${P(n)}" alt="Puzzelstuk"></button>`).join('')+'</div>';
html+='<button class="puzzle-check" onclick="checkPair()">✓ Controleer de volgorde</button><div class="controls"><button onclick="undoPair()">↶ Laatste terug</button><button onclick="resetPair()">↻ Opnieuw</button></div>';
}else if(l.type==='random'){
const t=tasks[l.round];html+='<div class="images">'+fig(P(t.start))+'</div><div class="options">'+t.opts.map((n,i)=>`<button class="option" onclick="answer(${i})">${fig(P(n))}<span>${'ABC'[i]}</span></button>`).join('')+'</div>';
}else{
if(l.imgs)html+='<div class="images">'+l.imgs.map(fig).join('')+'</div>';
html+=`<div class="${l.choices.length===2?'match-answers':'options'}">`+(l.type==='text'?l.choices.map((c,i)=>`<button class="textoption" onclick="answer(${i})">${'ABC'[i]}. ${c}</button>`).join(''):l.choices.map((c,i)=>`<button class="option" onclick="answer(${i})"><img src="${c}" alt="Antwoord ${'ABC'[i]}"><span>${'ABC'[i]}</span></button>`).join(''))+'</div>';
}
$('stage').innerHTML=html;
}
function answer(i){if(done[idx])return;const l=levels[idx];mark(i===(l.type==='random'?tasks[l.round].correct:l.correct))}
function selectPair(n){if(order.includes(n))return;activePiece=n;render()}
function dragPair(e,n){activePiece=n;e.dataTransfer.setData('text/plain',String(n))}
function dropPair(e,i){e.preventDefault();activePiece=Number(e.dataTransfer.getData('text/plain'));placePair(i)}
function placePair(i){if(activePiece===null){if(order[i]!==null){order[i]=null;delete done[idx];render()}return}const n=activePiece;if(order.includes(n))return;order[i]=n;activePiece=null;delete done[idx];wrong=false;render()}
function undoPair(){for(let i=7;i>=0;i--)if(order[i]!==null){order[i]=null;break}delete done[idx];render()}
function resetPair(){order=Array(8).fill(null);delete done[idx];wrong=false;render()}
function checkPair(){mark(order.every((n,i)=>n===i))}
function prev(){if(idx>0){idx--;wrong=false;render()}}
function next(){if(!done[idx])return;if(idx===levels.length-1){finished=true;results()}else{idx++;wrong=false;render()}}
function results(){$('chapter').textContent='DE GEHEUGENPROEF';$('title').textContent='Jouw resultaten';$('question').textContent='BWV 927 · Overzicht voor '+studentName;$('counter').textContent='VOLTOOID';$('progress').innerHTML=levels.map(()=>'<span class="done"></span>').join('');$('feedback').classList.add('hidden');$('status').textContent='Alle levels voltooid';$('prev').disabled=true;$('next').disabled=true;let e=Object.values(errors).reduce((a,b)=>a+b,0);$('stage').innerHTML=`<div class="result-grid"><div class="result-item"><b>${levels.length}</b><br>Levels</div><div class="result-item"><b>${e}</b><br>Foute pogingen</div><div class="result-item"><b>${Object.values(attempts).reduce((a,b)=>a+b,0)}</b><br>Pogingen</div></div><div class="results-list">`+levels.map((l,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #567;padding:9px 2px"><span>${i+1}. ${l.title}</span><span>${errors[i]||0} fout</span></div>`).join('')+`</div><div class="controls"><button onclick="window.print()">⎙ Print / PDF</button><button class="gold" onclick="restart()">↻ Speel opnieuw</button></div>`}
function restart(){idx=0;done={};attempts={};errors={};order=Array(8).fill(null);activePiece=null;wrong=false;finished=false;render()}
render();
</script></body></html>
